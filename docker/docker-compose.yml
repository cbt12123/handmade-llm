# =============================================================================
# 用法：
#   docker compose -f docker/docker-compose.yml run --rm llm-line bash
#   docker compose -f docker/docker-compose.yml run --rm llm-line bash script/run_all.sh
# （需要 NVIDIA Container Toolkit；无显卡请把 image 改成 llm-line:cpu 并删掉 deploy 段）
# =============================================================================
services:
  llm-line:
    image: llm-line:cu121
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /workspace
    volumes:
      - ../:/workspace
      - llm-line-cache:/root/.cache   # 缓存 torch extension 编译产物，第二次编译秒过
    stdin_open: true
    tty: true
    shm-size: "8g"                     # DataLoader / 多进程需要
    environment:
      - PYTHONUNBUFFERED=1
      - TORCH_CUDA_ARCH_LIST=7.5;8.0;8.6;8.9;9.0
      # 国内网络可取消下一行注释，走 HF 镜像站
      # - HF_ENDPOINT=https://hf-mirror.com
      # 需要访问 Llama / Gemma 等受限仓库时放你的 token
      # - HF_TOKEN=hf_xxxxxxxxxxxxxxxx
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: bash

volumes:
  llm-line-cache:
